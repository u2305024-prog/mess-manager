<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>মেস ম্যানেজার</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b6b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="মেস ম্যানেজার">
<style>
:root{--bg:#f3f5f2;--c:#fff;--t:#1c2a25;--p:#0b6b5c;--pt:#fff;--m:#66756f;--b:#d9e1dd;--neg:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1614;--c:#17231f;--t:#e5eeea;--p:#34d1b6;--pt:#06231d;--m:#8fa19a;--b:#2a3b36;--neg:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",sans-serif;font-size:16px;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
header{background:var(--p);color:var(--pt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}
header input{width:auto;border:0;padding:6px}
header button{background:rgba(255,255,255,.2);color:var(--pt);padding:7px 12px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.hint{color:var(--m);font-size:14px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>*{flex:1;min-width:0}
input{font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);width:100%}
button{font:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--p);color:var(--pt);cursor:pointer}
button.x{background:transparent;color:var(--neg);padding:4px 8px;flex:0}
button.big{width:100%;font-size:17px;padding:14px}
button.alt{background:transparent;color:var(--p);border:1px solid var(--p)}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b)}
.item:last-child{border:0}
.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.grid b{font-size:14px;color:var(--m);font-weight:600}
.m{color:var(--m);font-size:14px}
.panel{background:var(--pb);color:var(--ptx);border:1px solid var(--pbd);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{margin:0 0 2px;font-size:20px}.panel .sub{opacity:.75;font-size:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--tile);border-radius:10px;padding:10px}
.stat span{display:block;font-size:13px;opacity:.75}.stat b{font-size:20px}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--row);border-radius:12px;padding:12px;margin-bottom:10px}
.tag{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:700;color:#fff}
.tag.pay{background:#e5484d}.tag.get{background:#2faa6b}.tag.eq{background:#6b7785}
.amt{text-align:right}.amt b{font-size:20px;display:block}.amt small{font-size:12px;opacity:.75}
.det{font-size:12px;opacity:.7;margin-top:6px}
.legend{display:flex;gap:14px;font-size:13px;margin:4px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
header{flex-wrap:wrap}
.home{display:block;width:100%;text-align:left;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:14px}
.home h2{margin:0 0 6px;font-size:20px;color:var(--p)}.home p{margin:0;color:var(--m);font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--bg);border-radius:8px;padding:8px}.sum span{display:block;font-size:13px;color:var(--m)}.sum b{font-size:18px}
details{border-bottom:1px solid var(--b);padding:8px 0}summary{cursor:pointer;display:flex;justify-content:space-between}
button[style*="flex:0"]{flex:0 0 auto!important;white-space:nowrap;min-width:64px;padding:10px 16px}
button.x{flex:0 0 auto;white-space:nowrap;min-width:36px}
.row input{min-width:0;flex:1 1 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;border:2px solid var(--b);background:var(--c);color:var(--t)}
.chip.on{border-color:var(--p);font-weight:700}.chip i{width:14px;height:14px;border-radius:50%;border:1px solid #8886}
.walker{max-width:230px;margin:14px auto 0}.walker svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
</style>
</head>
<body>
<header><h1>মেস ম্যানেজার</h1><button id="hb" onclick="go('home')" style="display:none">হোম</button><input type="month" id="mon"><button id="ab" onclick="showArc()">আর্কাইভ</button></header>
<main>
<div id="phome">
  <button class="home" onclick="go('in')"><h2>মেসের হিসাব</h2><p>সবার মিল, বাজার ও ইউটিলিটি মিলিয়ে কে কত দিবে/ফেরত পাবে।</p></button>
  <button class="home" onclick="go('ind')"><h2>ব্যক্তিগত হিসাব</h2><p>নিজের বাজারের তালিকা, মাসের মোট খরচ ও আর্কাইভ।</p></button>
  <button class="home" onclick="go('bk')"><h2>ব্যাকআপ / রিস্টোর</h2><p id="bkn"></p></button>
  <div class="walker"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="সবজির ব্যাগ হাতে লুঙ্গি ও টি-শার্ট পরা একজন হেঁটে যাচ্ছেন">
<defs><pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#2f6fd6"/><rect width="8" height="8" fill="#1f56b3"/><rect x="8" y="8" width="8" height="8" fill="#1f56b3"/><path d="M0 8H16M8 0V16" stroke="#cfe0ff" stroke-width="1.2" opacity=".9"/></pattern></defs>
<ellipse cx="150" cy="326" rx="84" ry="9" fill="#000" opacity=".12"/>
<g class="bob">
<g stroke="#c48c60" stroke-width="17" stroke-linecap="round"><line x1="128" y1="258" x2="119" y2="312"/><line x1="172" y1="258" x2="185" y2="310"/></g>
<ellipse cx="114" cy="319" rx="18" ry="7" fill="#6b4226"/><ellipse cx="192" cy="317" rx="18" ry="7" fill="#6b4226"/>
<path d="M112,176 L188,176 L198,266 L102,266 Z" fill="url(#chk)"/>
<path d="M128,190 L124,262 M150,190 L150,264 M172,190 L176,262" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>
<rect x="102" y="258" width="96" height="8" fill="#163f85"/>
<rect x="110" y="170" width="80" height="16" rx="8" fill="#1a4aa0"/><circle cx="150" cy="178" r="6" fill="#12377a"/>
<g stroke="#c48c60" stroke-width="15" stroke-linecap="round"><line x1="98" y1="146" x2="87" y2="206"/><line x1="202" y1="146" x2="214" y2="204"/></g>
<circle cx="86" cy="212" r="9" fill="#c48c60"/>
<path d="M110,112 C124,100 176,100 190,112 L212,142 L190,158 L186,182 L114,182 L110,158 L88,142 Z" fill="#f08a3c"/>
<path d="M132,104 Q150,124 168,104" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="140" y="88" width="20" height="20" rx="6" fill="#b57d52"/>
<path d="M132,104 Q150,126 168,104 L160,98 L140,98 Z" fill="#b57d52"/>
<path d="M132,104 Q150,124 168,104" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="118" cy="68" r="7" fill="#cf9468"/><circle cx="182" cy="68" r="7" fill="#cf9468"/>
<circle cx="150" cy="64" r="32" fill="#cf9468"/>
<path d="M118,60 C114,24 186,24 182,60 C176,44 160,40 150,40 C138,40 124,44 118,60 Z" fill="#1a1410"/>
<path d="M130,56 Q138,51 146,55 M154,55 Q162,51 170,56" stroke="#1a1410" stroke-width="3" stroke-linecap="round" fill="none"/>
<circle cx="138" cy="66" r="3.4" fill="#1a1410"/><circle cx="162" cy="66" r="3.4" fill="#1a1410"/>
<path d="M150,68 Q154,76 148,78" stroke="#a8734b" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M133,82 Q150,72 167,82 Q158,89 150,85 Q142,89 133,82 Z" fill="#1a1410"/>
<path d="M142,93 Q150,98 158,93" stroke="#6b2e1f" stroke-width="3" fill="none" stroke-linecap="round"/>
<g>
<ellipse cx="204" cy="220" rx="9" ry="15" fill="#3aa655" transform="rotate(-30 204 220)"/><ellipse cx="216" cy="214" rx="8" ry="17" fill="#2f8f46"/><ellipse cx="230" cy="220" rx="9" ry="15" fill="#43b25f" transform="rotate(30 230 220)"/>
<ellipse cx="208" cy="268" rx="9" ry="22" fill="#6a3d9a" transform="rotate(-18 208 268)"/><ellipse cx="214" cy="247" rx="6" ry="4" fill="#3a9a4c" transform="rotate(-18 214 247)"/>
<polygon points="224,242 238,248 228,284" fill="#f2862a"/><circle cx="226" cy="282" r="11" fill="#e0382f"/><path d="M222,272 L230,272" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<path d="M204,292 Q212,302 223,297" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M196,236 Q196,224 214,222 Q238,224 242,238 Q252,272 232,298 Q214,306 198,296 Q184,270 196,236 Z" fill="#fff" fill-opacity=".38" stroke="#aab2b8" stroke-width="2"/>
<path d="M200,228 Q206,212 214,208 M232,228 Q224,212 214,208" stroke="#8a9199" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<circle cx="214" cy="208" r="9" fill="#c48c60"/>
</g>
</g>
</svg></div>
</div>
<div id="pind" style="display:none"></div>
<div id="piarc" style="display:none"></div>
<div id="pbk" style="display:none"></div>
<div id="pin" style="display:none">
  <div class="card"><h2>১. সদস্য তালিকা</h2>
    <div class="row"><input id="nm" placeholder="নাম লিখুন"><button style="flex:0" onclick="addMem()">যোগ</button></div>
    <div id="ml"></div></div>
  <div class="card"><h2>২. মিল ও বাজার</h2>
    <p class="hint">প্রত্যেকের মাসের মোট মিল এবং মোট বাজার খরচ (বাজারের টাকা জমা হিসেবে ধরা হবে)।</p>
    <div id="mb"></div></div>
  <div class="card"><h2>৩. ইউটিলিটি খরচ</h2>
    <p class="hint">বাসা ভাড়া, বিদ্যুৎ, গ্যাস, বুয়া, ময়লা... সব মোট করে সদস্য সংখ্যা দিয়ে ভাগ হবে।</p>
    <div class="row"><input id="fn" placeholder="খাতের নাম"><input type="number" id="fa" placeholder="টাকা" inputmode="decimal"><button style="flex:0" onclick="addFix()">যোগ</button></div>
    <div id="fl"></div></div>
  <button class="big" onclick="cont()">হিসাব দেখুন (Continue)</button>
  <div class="row" style="margin-top:12px"><button class="alt" style="color:var(--neg);border-color:var(--neg)" onclick="resetMon()">এই মাসের ডাটা মুছুন</button></div>
</div>
<div id="pres" style="display:none"></div>
<div id="parc" style="display:none"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const f=n=>(+n||0).toLocaleString('bn-BD',{maximumFractionDigits:2});
const g=n=>(+n||0).toLocaleString('bn-BD',{minimumFractionDigits:2,maximumFractionDigits:2});
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const ml=m=>new Date(m+'-01').toLocaleDateString('bn-BD',{year:'numeric',month:'long'});
let mon=new Date().toISOString().slice(0,7),M=rd('mess_members',[]),A=rd('mess_archive',{}),D,cur=null,from='in';
const empty=()=>({v:{},fixed:[]});
let I,IA=rd('mess_ind_arc',{});
function load(){D=rd('mess2_'+mon,empty());I=rd('mess_ind_'+mon,{items:[],due:0,other:0})}
function save(){try{localStorage.setItem('mess2_'+mon,JSON.stringify(D));localStorage.setItem('mess_members',JSON.stringify(M))}catch(e){alert('সেভ করা যায়নি')}}
function saveA(){try{localStorage.setItem('mess_archive',JSON.stringify(A))}catch(e){alert('আর্কাইভ সেভ করা যায়নি')}}
const val=(id,k)=>(D.v[id]&&D.v[id][k])||0;
const THEMES={white:{n:'সাদা',bg:'#ffffff',tx:'#1c2a25',tile:'#f1f5f3',row:'#f6f8f7',bd:'#d9e1dd'},
blue:{n:'হালকা নীল',bg:'#e8f0fb',tx:'#1b2a41',tile:'#d6e4f7',row:'#f5f9fe',bd:'#c3d6ef'},
mint:{n:'হালকা সবুজ',bg:'#e5f4ec',tx:'#173328',tile:'#d0eadc',row:'#f4fbf7',bd:'#bfe0cd'},
dark:{n:'ডার্ক',bg:'#1f2d3d',tx:'#ffffff',tile:'rgba(255,255,255,.08)',row:'rgba(255,255,255,.06)',bd:'#1f2d3d'}};
let TH=localStorage.getItem('mess_theme');if(!THEMES[TH])TH='white';
const tv=()=>{const t=THEMES[TH];return `--pb:${t.bg};--ptx:${t.tx};--tile:${t.tile};--row:${t.row};--pbd:${t.bd}`};
const chipsH=()=>Object.keys(THEMES).map(k=>`<button class="chip ${k==TH?'on':''}" onclick="setTheme('${k}')"><i style="background:${THEMES[k].bg}"></i>${THEMES[k].n}</button>`).join('');
function setTheme(k){TH=k;try{localStorage.setItem('mess_theme',k)}catch(e){}const p=$('#pres .panel');if(p)p.setAttribute('style',tv());$('#chips').innerHTML=chipsH()}
let pg='home';
function go(p){pg=p;['home','in','res','arc','ind','iarc','bk'].forEach(x=>$('#p'+x).style.display=x==p?'':'none');$('#mon').style.display=(p=='in'||p=='ind')?'':'none';$('#ab').style.display=(p=='in'||p=='res')?'':'none';$('#hb').style.display=p=='home'?'none':'';if(p=='ind')renderInd();if(p=='iarc')showIArc();if(p=='bk')renderBk();if(p=='home')homeNote();window.scrollTo(0,0)}

function calc(){
  const tm=M.reduce((s,m)=>s+val(m.id,'meal'),0),bz=M.reduce((s,m)=>s+val(m.id,'bazar'),0);
  const fx=D.fixed.reduce((s,x)=>s+x.amt,0),rate=tm?bz/tm:0,share=M.length?fx/M.length:0;
  const rows=M.map(m=>{const meal=val(m.id,'meal'),bazar=val(m.id,'bazar'),mc=meal*rate,total=mc+share;return{name:m.name,meal,bazar,mc,share,total,net:bazar-total}});
  return{tm,bz,fx,rate,share,rows};
}

function render(){
  $('#mon').value=mon;
  $('#ml').innerHTML=M.map(m=>`<div class="item"><span>${m.name}</span><button class="x" onclick="delMem(${m.id})">মুছুন</button></div>`).join('')||'<p class="m">এখনো কোনো সদস্য নেই।</p>';
  $('#mb').innerHTML=M.length?`<div class="grid"><b>নাম</b><b>মোট মিল</b><b>বাজার (৳)</b></div>`+M.map(m=>`<div class="grid"><span>${m.name}</span>
    <input type="number" min="0" step="0.5" inputmode="decimal" placeholder="০" value="${val(m.id,'meal')||''}" oninput="setV(${m.id},'meal',this.value)">
    <input type="number" min="0" inputmode="decimal" placeholder="০" value="${val(m.id,'bazar')||''}" oninput="setV(${m.id},'bazar',this.value)"></div>`).join(''):'<p class="m">আগে সদস্য যোগ করুন।</p>';
  $('#fl').innerHTML=D.fixed.map((x,i)=>`<div class="item"><span>${x.name}</span><span>${f(x.amt)} ৳<button class="x" onclick="delFix(${i})">✕</button></span></div>`).join('');
}
function addMem(){const n=$('#nm').value.trim();if(!n)return;M.push({id:Date.now(),name:n});$('#nm').value='';save();render()}
function delMem(id){if(confirm('এই সদস্যকে মুছবেন?')){M=M.filter(m=>m.id!=id);save();render()}}
function setV(id,k,v){(D.v[id]=D.v[id]||{})[k]=+v||0;save()}
function addFix(){const a=+$('#fa').value,n=$('#fn').value.trim();if(!a||!n)return;D.fixed.push({name:n,amt:a});$('#fn').value=$('#fa').value='';save();render()}
function delFix(i){D.fixed.splice(i,1);save();render()}
function resetMon(){if(confirm('এই মাসের সব মিল, বাজার ও ইউটিলিটি মুছে যাবে। নিশ্চিত?')){D=empty();save();render()}}

function cont(){const c=calc();if(!M.length||!c.tm){alert('সদস্য যোগ করুন এবং মিল ও বাজার দিন');return}showRes(c,mon,'in',false)}
const kind=r=>r.net>0.005?'get':r.net<-0.005?'pay':'eq';
const klabel={get:'ফেরত পাবে',pay:'দিতে হবে',eq:'হিসাব সমান'};

function showRes(c,label,origin,archived){
  cur={c,label,archived};from=origin;
  const pay=c.rows.filter(r=>kind(r)=='pay').reduce((t,r)=>t-r.net,0),get=c.rows.filter(r=>kind(r)=='get').reduce((t,r)=>t+r.net,0);
  $('#pres').innerHTML=`<div class="chips" id="chips">${chipsH()}</div><div class="panel" style="${tv()}"><h2>${ml(label)} মাসের হিসাব</h2><div class="sub">মেস ম্যানেজার</div>
  <div class="stats">
   <div class="stat"><span>মোট বাজার</span><b>${f(c.bz)} ৳</b></div><div class="stat"><span>মোট মিল</span><b>${f(c.tm)}</b></div>
   <div class="stat"><span>মিল রেট</span><b>${g(c.rate)} ৳</b></div><div class="stat"><span>জনপ্রতি ইউটিলিটি</span><b>${g(c.share)} ৳</b></div></div>
  <div class="legend"><span><i style="background:#e5484d"></i>দিতে হবে</span><span><i style="background:#2faa6b"></i>ফেরত পাবে</span></div>
  ${c.rows.map(r=>{const k=kind(r);return `<div class="person"><div><span class="tag ${k}">${r.name}</span>
   <div class="det">মিল ${f(r.meal)} × ${g(c.rate)} = ${g(r.mc)} + ইউটিলিটি ${g(r.share)}<br>মোট খরচ ${g(r.total)} − বাজার ${g(r.bazar)}</div></div>
   <div class="amt"><b>${g(Math.abs(r.net))} ৳</b><small>${klabel[k]}</small></div></div>`}).join('')}
  <div class="stats" style="margin:14px 0 0"><div class="stat"><span>মোট দিতে হবে</span><b>${g(pay)} ৳</b></div><div class="stat"><span>মোট ফেরত</span><b>${g(get)} ৳</b></div></div></div>
  <div class="row"><button onclick="dl()">ছবি ডাউনলোড</button><button onclick="share()">শেয়ার</button></div>
  ${archived?'':`<div class="row"><button class="alt" onclick="toArc()">আর্কাইভে সেভ করুন</button></div>`}
  <div class="row"><button class="alt" onclick="${origin=='arc'?'showArc()':'back()'}">← ফিরে যান</button></div>`;
  go('res');
}
function back(){go('in')}
function toArc(){A[cur.label]=Object.assign({},cur.c,{saved:Date.now()});saveA();alert(ml(cur.label)+' এর হিসাব আর্কাইভে সেভ হয়েছে।\nডাটা নিরাপদ রাখতে হোম → ব্যাকআপ থেকে ব্যাকআপ ফাইল নিয়ে রাখুন।')}

function showArc(){
  const ks=Object.keys(A).sort().reverse();
  $('#parc').innerHTML=`<div class="card"><h2>আর্কাইভ</h2><p class="hint">আগের মাসগুলোর সেভ করা হিসাব।</p>
  ${ks.map(k=>{const c=A[k];return `<div class="item"><div><b>${ml(k)}</b><div class="m">বাজার ${f(c.bz)} ৳ · রেট ${g(c.rate)} ৳ · ${f(c.rows.length)} জন</div></div>
  <span style="display:flex;gap:4px"><button style="padding:7px 12px" onclick="openArc('${k}')">দেখুন</button><button class="x" onclick="delArc('${k}')">✕</button></span></div>`}).join('')||'<p class="m">এখনো কোনো হিসাব সেভ করা হয়নি। হিসাবের পেজে "আর্কাইভে সেভ করুন" চাপুন।</p>'}</div>

function openArc(k){showRes(A[k],k,'arc',true)}
function delArc(k){if(confirm(ml(k)+' এর আর্কাইভ মুছবেন?')){delete A[k];saveA();showArc()}}

function rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fill()}
function draw(c,label){
  const t=THEMES[TH],W=800,H=330+c.rows.length*120+90,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),FF='"Hind Siliguri","Noto Sans Bengali",sans-serif',pay=c.rows.filter(r=>kind(r)=='pay').reduce((t,r)=>t-r.net,0),get=c.rows.filter(r=>kind(r)=='get').reduce((t,r)=>t+r.net,0);
  x.fillStyle=t.bg;x.fillRect(0,0,W,H);x.fillStyle=t.tx;x.textAlign='left';
  x.font='bold 40px '+FF;x.fillText('মেস ম্যানেজার',40,70);
  x.globalAlpha=.75;x.font='26px '+FF;x.fillText(ml(label)+' মাসের হিসাব',40,110);x.globalAlpha=1;
  [['মোট বাজার',f(c.bz)+' ৳'],['মোট মিল',f(c.tm)],['মিল রেট',g(c.rate)+' ৳'],['জনপ্রতি ইউটিলিটি',g(c.share)+' ৳']].forEach((s,i)=>{
    const px=40+(i%2)*370,py=140+Math.floor(i/2)*80;x.fillStyle=t.tile;rr(x,px,py,350,68,12);
    x.fillStyle=t.tx;x.globalAlpha=.75;x.font='18px '+FF;x.fillText(s[0],px+14,py+25);x.globalAlpha=1;x.font='bold 28px '+FF;x.fillText(s[1],px+14,py+57)});
  const col={pay:'#e5484d',get:'#2faa6b',eq:'#6b7785'};
  c.rows.forEach((r,i)=>{
    const y=320+i*120,k=kind(r);x.fillStyle=t.row;rr(x,40,y,720,100,16);
    x.font='bold 28px '+FF;const w=x.measureText(r.name).width+40;x.fillStyle=col[k];rr(x,60,y+14,w,46,23);
    x.fillStyle='#fff';x.fillText(r.name,80,y+47);x.fillStyle=t.tx;
    x.globalAlpha=.7;x.font='18px '+FF;x.fillText('মিল '+f(r.meal)+' | মোট খরচ '+g(r.total)+' | বাজার '+g(r.bazar),60,y+88);x.globalAlpha=1;
    x.textAlign='right';x.font='bold 32px '+FF;x.fillText(g(Math.abs(r.net))+' ৳',740,y+46);
    x.globalAlpha=.8;x.font='20px '+FF;x.fillText(klabel[k],740,y+78);x.globalAlpha=1;x.textAlign='left'});
  x.font='22px '+FF;x.fillText('মোট দিতে হবে '+g(pay)+' ৳   |   মোট ফেরত '+g(get)+' ৳',40,H-34);
  return cv;
}
function blob(cb){draw(cur.c,cur.label).toBlob(cb,'image/png')}
function dl(){blob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mess-manager-'+cur.label+'.png';document.body.appendChild(a);a.click();a.remove()})}
function share(){blob(b=>{
  const file=new File([b],'mess-manager-'+cur.label+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'মেস ম্যানেজার '+ml(cur.label)}).catch(()=>{});
  else{alert('এই ডিভাইসে সরাসরি শেয়ার সাপোর্ট নেই। ছবি ডাউনলোড হচ্ছে, সেটা শেয়ার করুন।');dl()}})}

$('#mon').onchange=e=>{mon=e.target.value||mon;load();render();if(pg=='ind')renderInd()};
const itot=()=>I.items.reduce((s,x)=>s+x.price,0);
function saveI(){try{localStorage.setItem('mess_ind_'+mon,JSON.stringify(I))}catch(e){alert('সেভ করা যায়নি')}}
function renderInd(){
  $('#pind').innerHTML=`<div class="card"><h2>আমার বাজারের তালিকা</h2><p class="hint">${ml(mon)} মাস। প্রতিটি পণ্যের নাম ও দাম লিখুন।</p>
  <div class="row"><input placeholder="আপনার নাম" value="${getName()}" oninput="setIn('name',this.value)"><input type="date" value="${I.date||defDate()}" oninput="setIn('date',this.value)"></div>
  <div class="row"><input id="pn" placeholder="পণ্যের নাম"><input type="number" id="pp" placeholder="দাম (৳)" inputmode="decimal"><button style="flex:0" onclick="addItem()">যোগ</button></div>
  ${I.items.map((x,i)=>`<div class="item"><span>${x.name}</span><span>${f(x.price)} ৳<button class="x" onclick="delItem(${i})">✕</button></span></div>`).join('')||'<p class="m">এখনো কোনো পণ্য নেই।</p>'}
  <div class="item"><b>মোট বাজার খরচ</b><b id="bt"></b></div>
  <div class="row"><button onclick="dlList()">ছবি ডাউনলোড</button><button onclick="shareList()">শেয়ার</button></div></div>
  <div class="card"><h2>মাস শেষের হিসাব</h2><p class="hint">মেসের হিসাবে আপনাকে যা দিতে হয়েছে এবং অন্য খরচ লিখুন।</p>
  <div class="row"><input type="number" inputmode="decimal" placeholder="মেসে দিতে হয়েছে (৳)" value="${I.due||''}" oninput="setI('due',this.value)"></div>
  <div class="row"><input type="number" inputmode="decimal" placeholder="অন্যান্য খরচ (৳)" value="${I.other||''}" oninput="setI('other',this.value)"></div>
  <div class="sum" id="isum"></div>
  <button class="big" onclick="saveIA()">আর্কাইভে সেভ করুন</button></div>
  <div class="row"><button class="alt" onclick="go('iarc')">আমার আর্কাইভ</button></div>`;sumI();
}
function sumI(){const b=itot();$('#bt').textContent=f(b)+' ৳';$('#isum').innerHTML=`<div><span>বাজার</span><b>${f(b)} ৳</b></div><div><span>মেসে দেওয়া</span><b>${f(I.due)} ৳</b></div><div><span>অন্যান্য</span><b>${f(I.other)} ৳</b></div><div><span>মোট খরচ</span><b>${f(b+I.due+I.other)} ৳</b></div>`}
function addItem(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!p)return;I.items.push({name:n,price:p});saveI();renderInd()}
function delItem(i){I.items.splice(i,1);saveI();renderInd()}
function setI(k,v){I[k]=+v||0;saveI();sumI()}
function saveIA(){IA[mon]=Object.assign({},I,{saved:Date.now()});try{localStorage.setItem('mess_ind_arc',JSON.stringify(IA))}catch(e){}alert(ml(mon)+' এর ব্যক্তিগত হিসাব আর্কাইভে সেভ হয়েছে।\nডাটা নিরাপদ রাখতে হোম → ব্যাকআপ থেকে ব্যাকআপ ফাইল নিয়ে রাখুন।')}
function showIArc(){
  const ks=Object.keys(IA).sort().reverse();
  $('#piarc').innerHTML=`<div class="card"><h2>আমার আর্কাইভ</h2><p class="hint">প্রতি মাসের ব্যক্তিগত খরচ।</p>
  ${ks.map(k=>{const c=IA[k],b=c.items.reduce((s,x)=>s+x.price,0);return `<details><summary><b>${ml(k)}</b><span>${f(b+c.due+c.other)} ৳</span></summary>
  <div class="m" style="margin:6px 0">বাজার ${f(b)} ৳ · মেসে দেওয়া ${f(c.due)} ৳ · অন্যান্য ${f(c.other)} ৳</div>
  ${c.items.map(x=>`<div class="item"><span>${x.name}</span><span>${f(x.price)} ৳</span></div>`).join('')}
  <button class="alt" style="margin-top:8px;color:var(--neg);border-color:var(--neg)" onclick="delIA('${k}')">মুছুন</button></details>`}).join('')||'<p class="m">এখনো কিছু সেভ করা হয়নি।</p>'}</div>
  <div class="row"><button class="alt" onclick="go('ind')">← ফিরে যান</button></div>`;
}
function delIA(k){if(confirm(ml(k)+' এর আর্কাইভ মুছবেন?')){delete IA[k];try{localStorage.setItem('mess_ind_arc',JSON.stringify(IA))}catch(e){}showIArc()}}
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=d=>new Date(d).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
const defDate=()=>mon==today().slice(0,7)?today():mon+'-01';
const getName=()=>I.name!=null?I.name:(localStorage.getItem('mess_ind_name')||'');
function setIn(k,v){I[k]=v;if(k=='name'){try{localStorage.setItem('mess_ind_name',v)}catch(e){}}saveI()}
function fileDl(cv,n){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()},'image/png')}
function fileShare(cv,n,title){cv.toBlob(b=>{const file=new File([b],n,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title}).catch(()=>{});
  else{alert('এই ডিভাইসে সরাসরি শেয়ার সাপোর্ট নেই। ছবি ডাউনলোড হচ্ছে, সেটা শেয়ার করুন।');fileDl(cv,n)}},'image/png')}
function drawList(){
  const t=THEMES[TH],it=I.items,n=it.length,W=800,tot=itot(),totY=250+n*64+40,H=totY+60,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),FF='"Hind Siliguri","Noto Sans Bengali",sans-serif';
  const clip=(s,w)=>{while(x.measureText(s).width>w&&s.length>1)s=s.slice(0,-1);return s};
  x.fillStyle=t.bg;x.fillRect(0,0,W,H);x.fillStyle=t.tx;x.textAlign='left';
  x.font='bold 40px '+FF;x.fillText('বাজারের তালিকা',40,70);
  x.font='bold 30px '+FF;x.fillText(clip(getName()||'—',720),40,125);
  x.globalAlpha=.75;x.font='24px '+FF;x.fillText(dfmt(I.date||defDate()),40,165);x.globalAlpha=1;
  x.strokeStyle='rgba(128,128,128,.45)';x.lineWidth=2;x.beginPath();x.moveTo(40,190);x.lineTo(760,190);x.stroke();
  it.forEach((r,i)=>{const y=240+i*64;x.textAlign='left';x.font='26px '+FF;x.fillText(clip(r.name,540),40,y);
    x.textAlign='right';x.fillText(g(r.price)+' ৳',760,y);x.lineWidth=1;x.beginPath();x.moveTo(40,y+22);x.lineTo(760,y+22);x.stroke()});
  x.lineWidth=2;x.beginPath();x.moveTo(40,totY-42);x.lineTo(760,totY-42);x.stroke();
  x.textAlign='left';x.font='bold 32px '+FF;x.fillText('মোট',40,totY);x.textAlign='right';x.fillText(g(tot)+' ৳',760,totY);
  return cv;
}
const lname=()=>'bazar-list-'+(I.date||defDate())+'.png';
function dlList(){if(!I.items.length){alert('আগে পণ্য যোগ করুন');return}fileDl(drawList(),lname())}
function shareList(){if(!I.items.length){alert('আগে পণ্য যোগ করুন');return}fileShare(drawList(),lname(),'বাজারের তালিকা')}

function homeNote(){const t=localStorage.getItem('mess_last_backup');$('#bkn').textContent=t?'সর্বশেষ ব্যাকআপ: '+dfmt(t):'⚠ এখনো ব্যাকআপ নেওয়া হয়নি। ডাটা হারানো ঠেকাতে ব্যাকআপ নিন।'}
function allData(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('mess'))o[k]=localStorage.getItem(k)}return o}
function exportAll(){const d=today();try{localStorage.setItem('mess_last_backup',d)}catch(e){}
  const b=new Blob([JSON.stringify({app:'mess-manager',v:1,date:d,data:allData()})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mess-manager-backup-'+d+'.json';document.body.appendChild(a);a.click();a.remove();renderBk()}
function importAll(inp){const fl=inp.files[0];if(!fl)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!='mess-manager'||!o.data)throw 0;
    if(!confirm('ব্যাকআপ ফাইলের ডাটা ফোনে যোগ হবে। আর্কাইভ মার্জ হবে (একই মাস থাকলে ফোনের টা থাকবে), বাকি ডাটা ফাইলের ডাটা দিয়ে বদলাবে। নিশ্চিত?'))return;
    Object.keys(o.data).forEach(k=>{if(!k.startsWith('mess'))return;
      if(k=='mess_archive'||k=='mess_ind_arc')localStorage.setItem(k,JSON.stringify(Object.assign({},JSON.parse(o.data[k]||'{}'),rd(k,{}))));
      else localStorage.setItem(k,o.data[k])});
    alert('রিস্টোর সম্পন্ন হয়েছে');location.reload()}catch(e){alert('এটি সঠিক ব্যাকআপ ফাইল নয়')}};
  r.readAsText(fl)}
async function renderBk(){
  let ps=false;try{ps=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false}catch(e){}
  const t=localStorage.getItem('mess_last_backup');
  $('#pbk').innerHTML=`<div class="card"><h2>ব্যাকআপ / রিস্টোর</h2>
  <p class="hint">আপনার সব ডাটা (আর্কাইভসহ) ফোনেই থাকে। ব্রাউজার ডাটা মুছলে, অ্যাপ আনইনস্টল করলে বা ফোন বদলালে তা হারিয়ে যেতে পারে। তাই ব্যাকআপ ফাইল নিয়ে Google Drive, WhatsApp বা ইমেইলে রেখে দিন।</p>
  <div class="row"><button class="big" onclick="exportAll()">ব্যাকআপ ফাইল ডাউনলোড</button></div>
  <div class="row"><button class="big alt" onclick="document.getElementById('bkf').click()">ব্যাকআপ ফাইল থেকে রিস্টোর</button></div>
  <input type="file" id="bkf" accept=".json,application/json" style="display:none" onchange="importAll(this)">
  <div class="sum"><div><span>সর্বশেষ ব্যাকআপ</span><b style="font-size:15px">${t?dfmt(t):'নেওয়া হয়নি'}</b></div><div><span>স্থায়ী সংরক্ষণ</span><b style="font-size:15px">${ps?'চালু ✅':'চালু নয়'}</b></div></div>
  <p class="hint">"স্থায়ী সংরক্ষণ চালু" থাকলে ব্রাউজার জায়গা কমে গেলেও আপনার ডাটা নিজে থেকে মুছবে না। তবে ব্রাউজার ডাটা ক্লিয়ার বা আনইনস্টল করলে তখনও মুছে যায়, তাই ব্যাকআপ ফাইল রাখাই নিরাপদ।</p></div>
  <div class="row"><button class="alt" onclick="go('home')">← ফিরে যান</button></div>`;
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
load();render();go('home');
