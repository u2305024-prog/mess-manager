<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>মেস ম্যানেজার</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b6b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="মেস ম্যানেজার">
<style>
:root{--bg:#f3f5f2;--c:#fff;--t:#1c2a25;--p:#0b6b5c;--pt:#fff;--m:#66756f;--b:#d9e1dd;--neg:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1614;--c:#17231f;--t:#e5eeea;--p:#34d1b6;--pt:#06231d;--m:#8fa19a;--b:#2a3b36;--neg:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",sans-serif;font-size:16px;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
header{background:var(--p);color:var(--pt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}
header input{width:auto;border:0;padding:6px}
header button{background:rgba(255,255,255,.2);color:var(--pt);padding:7px 12px}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.hint{color:var(--m);font-size:14px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>*{flex:1;min-width:0}
input{font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);width:100%}
button{font:inherit;border:0;border-radius:8px;padding:11px 14px;background:var(--p);color:var(--pt);cursor:pointer}
button.x{background:transparent;color:var(--neg);padding:4px 8px;flex:0}
button.big{width:100%;font-size:17px;padding:14px}
button.alt{background:transparent;color:var(--p);border:1px solid var(--p)}
.item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b)}
.item:last-child{border:0}
.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.grid b{font-size:14px;color:var(--m);font-weight:600}
.m{color:var(--m);font-size:14px}
.panel{background:var(--pb);color:var(--ptx);border:1px solid var(--pbd);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{margin:0 0 2px;font-size:20px}.panel .sub{opacity:.75;font-size:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--tile);border-radius:10px;padding:10px}
.stat span{display:block;font-size:13px;opacity:.75}.stat b{font-size:20px}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--row);border-radius:12px;padding:12px;margin-bottom:10px}
.tag{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:700;color:#fff}
.tag.pay{background:#e5484d}.tag.get{background:#2faa6b}.tag.eq{background:#6b7785}
.amt{text-align:right}.amt b{font-size:20px;display:block}.amt small{font-size:12px;opacity:.75}
.det{font-size:12px;opacity:.7;margin-top:6px}
.legend{display:flex;gap:14px;font-size:13px;margin:4px 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
header{flex-wrap:wrap}
.home{display:block;width:100%;text-align:left;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:14px}
.home h2{margin:0 0 6px;font-size:20px;color:var(--p)}.home p{margin:0;color:var(--m);font-size:14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--bg);border-radius:8px;padding:8px}.sum span{display:block;font-size:13px;color:var(--m)}.sum b{font-size:18px}
details{border-bottom:1px solid var(--b);padding:8px 0}summary{cursor:pointer;display:flex;justify-content:space-between}
button[style*="flex:0"]{flex:0 0 auto!important;white-space:nowrap;min-width:64px;padding:10px 16px}
button.x{flex:0 0 auto;white-space:nowrap;min-width:36px}
.row input{min-width:0;flex:1 1 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;border:2px solid var(--b);background:var(--c);color:var(--t)}
.chip.on{border-color:var(--p);font-weight:700}.chip i{width:14px;height:14px;border-radius:50%;border:1px solid #8886}
.walker{max-width:230px;margin:14px auto 0}.walker svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
select{font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);width:100%}
button.ad{flex:0 0 auto!important;white-space:nowrap;min-width:64px;padding:10px 16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--b)}th:first-child,td:first-child{text-align:left}
.pos{color:#067647;font-weight:700}.neg{color:var(--neg);font-weight:700}
@media(prefers-color-scheme:dark){.pos{color:#5fe0a0}}
header button#lb{padding:7px 10px}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><button id="hb" onclick="go('home')" style="display:none"></button><input type="month" id="mon"><button id="lb" onclick="setLang()"></button><button id="ab" onclick="go('arc')"></button></header>
<main>
<div id="phome"><div id="hbtns"></div>
  <div class="walker"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="সবজির ব্যাগ হাতে লুঙ্গি ও টি-শার্ট পরা একজন হেঁটে যাচ্ছেন">
<defs><pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#2f6fd6"/><rect width="8" height="8" fill="#1f56b3"/><rect x="8" y="8" width="8" height="8" fill="#1f56b3"/><path d="M0 8H16M8 0V16" stroke="#cfe0ff" stroke-width="1.2" opacity=".9"/></pattern></defs>
<ellipse cx="150" cy="326" rx="84" ry="9" fill="#000" opacity=".12"/>
<g class="bob">
<g stroke="#c48c60" stroke-width="17" stroke-linecap="round"><line x1="128" y1="258" x2="119" y2="312"/><line x1="172" y1="258" x2="185" y2="310"/></g>
<ellipse cx="114" cy="319" rx="18" ry="7" fill="#6b4226"/><ellipse cx="192" cy="317" rx="18" ry="7" fill="#6b4226"/>
<path d="M112,176 L188,176 L198,266 L102,266 Z" fill="url(#chk)"/>
<path d="M128,190 L124,262 M150,190 L150,264 M172,190 L176,262" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>
<rect x="102" y="258" width="96" height="8" fill="#163f85"/>
<rect x="110" y="170" width="80" height="16" rx="8" fill="#1a4aa0"/><circle cx="150" cy="178" r="6" fill="#12377a"/>
<g stroke="#c48c60" stroke-width="15" stroke-linecap="round"><line x1="98" y1="146" x2="87" y2="206"/><line x1="202" y1="146" x2="214" y2="204"/></g>
<circle cx="86" cy="212" r="9" fill="#c48c60"/>
<path d="M110,112 C124,100 176,100 190,112 L212,142 L190,158 L186,182 L114,182 L110,158 L88,142 Z" fill="#f08a3c"/>
<path d="M132,104 Q150,124 168,104" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="140" y="88" width="20" height="20" rx="6" fill="#b57d52"/>
<path d="M132,104 Q150,126 168,104 L160,98 L140,98 Z" fill="#b57d52"/>
<path d="M132,104 Q150,124 168,104" stroke="#c96a22" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="118" cy="68" r="7" fill="#cf9468"/><circle cx="182" cy="68" r="7" fill="#cf9468"/>
<circle cx="150" cy="64" r="32" fill="#cf9468"/>
<path d="M118,60 C114,24 186,24 182,60 C176,44 160,40 150,40 C138,40 124,44 118,60 Z" fill="#1a1410"/>
<path d="M130,56 Q138,51 146,55 M154,55 Q162,51 170,56" stroke="#1a1410" stroke-width="3" stroke-linecap="round" fill="none"/>
<circle cx="138" cy="66" r="3.4" fill="#1a1410"/><circle cx="162" cy="66" r="3.4" fill="#1a1410"/>
<path d="M150,68 Q154,76 148,78" stroke="#a8734b" stroke-width="2" fill="none" stroke-linecap="round"/>

<path d="M142,93 Q150,98 158,93" stroke="#6b2e1f" stroke-width="3" fill="none" stroke-linecap="round"/>
<g>
<ellipse cx="204" cy="220" rx="9" ry="15" fill="#3aa655" transform="rotate(-30 204 220)"/><ellipse cx="216" cy="214" rx="8" ry="17" fill="#2f8f46"/><ellipse cx="230" cy="220" rx="9" ry="15" fill="#43b25f" transform="rotate(30 230 220)"/>
<ellipse cx="208" cy="268" rx="9" ry="22" fill="#6a3d9a" transform="rotate(-18 208 268)"/><ellipse cx="214" cy="247" rx="6" ry="4" fill="#3a9a4c" transform="rotate(-18 214 247)"/>
<polygon points="224,242 238,248 228,284" fill="#f2862a"/><circle cx="226" cy="282" r="11" fill="#e0382f"/><path d="M222,272 L230,272" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<path d="M204,292 Q212,302 223,297" stroke="#2f9e44" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M196,236 Q196,224 214,222 Q238,224 242,238 Q252,272 232,298 Q214,306 198,296 Q184,270 196,236 Z" fill="#fff" fill-opacity=".38" stroke="#aab2b8" stroke-width="2"/>

</svg></div>
</div>
<div id="pin" style="display:none"></div><div id="pres" style="display:none"></div><div id="parc" style="display:none"></div>
<div id="pind" style="display:none"></div><div id="piarc" style="display:none"></div><div id="pmc" style="display:none"></div><div id="pbz" style="display:none"></div>
</main>
<script>
const $=s=>document.querySelector(s);
let lang=localStorage.getItem('mess_lang')||'bn';
const L=(b,e)=>lang=='bn'?b:e,LOC=()=>lang=='bn'?'bn-BD':'en-US';
const f=n=>(+n||0).toLocaleString(LOC(),{maximumFractionDigits:2});
const g=n=>(+n||0).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert(L('সেভ করা যায়নি','Could not save'))}};
const ND=s=>String(s).replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[,،]/g,'').replace(/।/g,'.');
const P=v=>{const n=parseFloat(ND(v));return isFinite(n)&&n>0?n:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const ml=m=>new Date(m+'-01T00:00:00').toLocaleDateString(LOC(),{year:'numeric',month:'long'});
const dfmt=d=>new Date(d+'T00:00:00').toLocaleDateString(LOC(),{day:'numeric',month:'long',year:'numeric'});
const T0={white:{n:['সাদা','White'],bg:'#ffffff',tx:'#1c2a25',tile:'#f1f5f3',row:'#f6f8f7',bd:'#d9e1dd'},blue:{n:['হালকা নীল','Light blue'],bg:'#e8f0fb',tx:'#1b2a41',tile:'#d6e4f7',row:'#f5f9fe',bd:'#c3d6ef'},mint:{n:['হালকা সবুজ','Light green'],bg:'#e5f4ec',tx:'#173328',tile:'#d0eadc',row:'#f4fbf7',bd:'#bfe0cd'},dark:{n:['ডার্ক','Dark'],bg:'#1f2d3d',tx:'#ffffff',tile:'rgba(255,255,255,.08)',row:'rgba(255,255,255,.06)',bd:'#1f2d3d'}};
let TH=localStorage.getItem('mess_theme');if(!T0[TH])TH='white';
let mon=today().slice(0,7),M=rd('mess_members',[]),A=rd('mess_archive',{}),IA=rd('mess_ind_arc',{}),BZ=rd('mess_bz',[]),D,I,MC,pg='home',cur=null,bf='',bt='';
const getMC=ym=>rd('mess_mc_'+ym,{def:+localStorage.getItem('mess_def')||2,r:[]});
function load(){D=rd('mess2_'+mon,{v:{},fixed:[]});I=rd('mess_ind_'+mon,{items:[],due:0,other:0});MC=getMC(mon)}
const sD=()=>{wr('mess2_'+mon,D);wr('mess_members',M)},sI=()=>wr('mess_ind_'+mon,I),sMC=()=>wr('mess_mc_'+mon,MC),sBZ=()=>wr('mess_bz',BZ);
const val=(id,k)=>(D.v[id]&&D.v[id][k])||0,nm=id=>(M.find(m=>m.id==id)||{name:'?'}).name;
const RENDER={};
const uid=arr=>arr.reduce((s,x)=>Math.max(s,x.id),Date.now())+1;

/* navigation (works with Android back button) */
function go(p,push=true){
  if(p=='res'&&!cur)p='home';
  pg=p;['home','in','res','arc','ind','iarc','mc','bz'].forEach(x=>$('#p'+x).style.display=x==p?'':'none');
  $('#mon').style.display=(p=='in'||p=='ind'||p=='mc')?'':'none';$('#ab').style.display=(p=='in'||p=='res')?'':'none';$('#hb').style.display=p=='home'?'none':'';
  $('#mon').value=mon;hdr();RENDER[p]();if(push)history.pushState({p},'');window.scrollTo(0,0);
}
addEventListener('popstate',e=>go(e.state&&e.state.p||'home',false));
function hdr(){$('#ttl').textContent=L('মেস ম্যানেজার','Mess Manager');$('#hb').textContent=L('হোম','Home');$('#ab').textContent=L('আর্কাইভ','Archive');$('#lb').textContent=L('English','বাংলা');document.title=L('মেস ম্যানেজার','Mess Manager');document.documentElement.lang=lang}
function setLang(){lang=lang=='bn'?'en':'bn';try{localStorage.setItem('mess_lang',lang)}catch(e){}hdr();RENDER[pg]()}
const back='<div class="row"><button class="alt" onclick="history.back()">'+'←</button></div>';
const bkb=()=>`<div class="row"><button class="alt" onclick="history.back()">← ${L('ফিরে যান','Back')}</button></div>`;

/* meal count helpers */
const mealsOn=(mid,d,c)=>{let m=c.def;for(const r of c.r)if((r.mid=='all'||r.mid==mid)&&d>=r.f&&d<=r.t)m=r.m;return m};
function memberMeals(mid,from,to){
  if(!from||!to||from>to)return 0;let tot=0,n=0;const cache={};
  for(let d=new Date(from+'T00:00:00');ds(d)<=to&&n<800;d.setDate(d.getDate()+1),n++){const s=ds(d),ym=s.slice(0,7);tot+=mealsOn(mid,s,cache[ym]||(cache[ym]=ym==mon?MC:getMC(ym)))}
  return tot;
}
const mRange=()=>[mon+'-01',mon+'-'+pad(dim(mon))];

/* ===== HOME ===== */
RENDER.home=()=>{$('#hbtns').innerHTML=[['in',L('মেসের হিসাব','Mess Account'),L('সবার মিল, বাজার ও ইউটিলিটি মিলিয়ে কে কত দিবে/ফেরত পাবে।','Who pays / gets back, from meals, bazar and utilities.')],
 ['ind',L('ব্যক্তিগত হিসাব','Personal Account'),L('নিজের বাজারের তালিকা, মাসের মোট খরচ ও আর্কাইভ।','Your own bazar list, monthly total and archive.')],
 ['mc',L('মিল গণনা','Meal Count'),L('ডিফল্ট মিল সেট করুন, ছুটির দিন বাদ দিন, মাসের মোট মিল দেখুন।','Set default meals, mark off days, see total meals of the month.')],
 ['bz',L('তারিখ অনুযায়ী বাজার','Bazar by Date'),L('কে কত বাজার করেছে (তারিখ থেকে–পর্যন্ত) ও মিল রেট।','Who bought how much (date range) and the meal rate.')]]
 .map(x=>`<button class="home" onclick="go('${x[0]}')"><h2>${x[1]}</h2><p>${x[2]}</p></button>`).join('')};

/* ===== MESS ACCOUNT ===== */
function calc(){
  const tm=M.reduce((s,m)=>s+val(m.id,'meal'),0),bz=M.reduce((s,m)=>s+val(m.id,'bazar'),0),fx=D.fixed.reduce((s,x)=>s+x.amt,0),rate=tm?bz/tm:0,share=M.length?fx/M.length:0;
  return{tm,bz,fx,rate,share,rows:M.map(m=>{const meal=val(m.id,'meal'),bazar=val(m.id,'bazar'),mc=meal*rate,total=mc+share;return{name:m.name,meal,bazar,mc,share,total,net:bazar-total}})};
}
RENDER.in=()=>{
  $('#pin').innerHTML=`<div class="card"><h2>${L('১. সদস্য তালিকা','1. Members')}</h2>
  <div class="row"><input id="nm" placeholder="${L('নাম লিখুন','Enter name')}"><button class="ad" onclick="addMem()">${L('যোগ','Add')}</button></div>
  ${M.map(m=>`<div class="item"><span>${esc(m.name)}</span><span><button class="x" onclick="renMem(${m.id})">✎</button><button class="x" onclick="delMem(${m.id})">✕</button></span></div>`).join('')||`<p class="m">${L('এখনো কোনো সদস্য নেই।','No members yet.')}</p>`}</div>
  <div class="card"><h2>${L('২. মিল ও বাজার','2. Meals and Bazar')}</h2><p class="hint">${L('প্রত্যেকের মাসের মোট মিল এবং মোট বাজার খরচ (বাজারের টাকা জমা হিসেবে ধরা হবে)।','Each person\'s total meals and total bazar spending for the month (bazar money counts as deposit).')}</p>
  ${M.length?`<div class="grid"><b>${L('নাম','Name')}</b><b>${L('মোট মিল','Total meals')}</b><b>${L('বাজার (৳)','Bazar (৳)')}</b></div>`+M.map(m=>`<div class="grid"><span>${esc(m.name)}</span><input inputmode="decimal" placeholder="0" value="${val(m.id,'meal')||''}" oninput="setV(${m.id},'meal',this.value)"><input inputmode="decimal" placeholder="0" value="${val(m.id,'bazar')||''}" oninput="setV(${m.id},'bazar',this.value)"></div>`).join('')+`<div class="row"><button class="alt" onclick="fromMc()">${L('মিল গণনা থেকে মিল নিন','Fill meals from Meal Count')}</button></div>`:`<p class="m">${L('আগে সদস্য যোগ করুন।','Add members first.')}</p>`}</div>
  <div class="card"><h2>${L('৩. ইউটিলিটি খরচ','3. Utility costs')}</h2><p class="hint">${L('বাসা ভাড়া, বিদ্যুৎ, গ্যাস, বুয়া, ময়লা... সব মোট করে সদস্য সংখ্যা দিয়ে ভাগ হবে।','Rent, electricity, gas, maid, waste... all summed and divided by the number of members.')}</p>
  <div class="row"><input id="fn" placeholder="${L('খাতের নাম','Item name')}"><input id="fa" inputmode="decimal" placeholder="${L('টাকা','Amount')}"><button class="ad" onclick="addFix()">${L('যোগ','Add')}</button></div>
  ${D.fixed.map((x,i)=>`<div class="item"><span>${esc(x.name)}</span><span>${f(x.amt)} ৳<button class="x" onclick="editFix(${i})">✎</button><button class="x" onclick="delFix(${i})">✕</button></span></div>`).join('')}</div>
  <button class="big" onclick="cont()">${L('হিসাব দেখুন (Continue)','View result (Continue)')}</button>

function rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fill()}
const FF='"Hind Siliguri","Noto Sans Bengali",sans-serif';
function draw(c,label){
  const t=T0[TH],W=800,H=330+c.rows.length*120+90,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d'),[pay,get]=sums(c),kl=KL();

  [[L('মোট বাজার','Total bazar'),f(c.bz)+' ৳'],[L('মোট মিল','Total meals'),f(c.tm)],[L('মিল রেট','Meal rate'),g(c.rate)+' ৳'],[L('জনপ্রতি ইউটিলিটি','Utility per person'),g(c.share)+' ৳']].forEach((s,i)=>{
    const px=40+(i%2)*370,py=140+Math.floor(i/2)*80;x.fillStyle=t.tile;rr(x,px,py,350,68,12);x.fillStyle=t.tx;x.globalAlpha=.75;x.font='18px '+FF;x.fillText(s[0],px+14,py+25);x.globalAlpha=1;x.font='bold 28px '+FF;x.fillText(s[1],px+14,py+57)});
  const col={pay:'#e5484d',get:'#2faa6b',eq:'#6b7785'};
  c.rows.forEach((r,i)=>{const y=320+i*120,k=kind(r);x.fillStyle=t.row;rr(x,40,y,720,100,16);x.font='bold 28px '+FF;
    let nmx=r.name;while(x.measureText(nmx).width>360&&nmx.length>1)nmx=nmx.slice(0,-1);const w=x.measureText(nmx).width+40;x.fillStyle=col[k];rr(x,60,y+14,w,46,23);x.fillStyle='#fff';x.fillText(nmx,80,y+47);x.fillStyle=t.tx;

    x.textAlign='right';x.font='bold 32px '+FF;x.fillText(g(Math.abs(r.net))+' ৳',740,y+46);x.globalAlpha=.8;x.font='20px '+FF;x.fillText(kl[k],740,y+78);x.globalAlpha=1;x.textAlign='left'});
  x.font='22px '+FF;x.fillText(L('মোট দিতে হবে ','To pay ')+g(pay)+' ৳   |   '+L('মোট ফেরত ','To get back ')+g(get)+' ৳',40,H-34);return cv;
}

  <div class="card"><h2>${L('মাসের মোট মিল','Total meals this month')}</h2>
  ${M.length?`<div class="tw"><table><tr><th>${L('নাম','Name')}</th><th>${L('মোট মিল','Total')}</th></tr>${M.map((m,i)=>`<tr><td>${esc(m.name)}</td><td>${f(tot[i])}</td></tr>`).join('')}<tr><td><b>${L('সর্বমোট','Grand total')}</b></td><td><b>${f(gt)}</b></td></tr></table></div><div class="row"><button class="alt" onclick="fromMc()">${L('মেসের হিসাবে নিন','Use in Mess Account')}</button></div>`:`<p class="m">${L('আগে মেসের হিসাব থেকে সদস্য যোগ করুন।','Add members in Mess Account first.')}</p>`}</div>
  <div class="card"><h2>${L('মিল বন্ধ / কম (ছুটি)','Meals off / reduced')}</h2><p class="hint">${L('কেউ কোনো দিন বা কয়েকদিন না খেলে, বা কম খেলে, তারিখ দিয়ে এখানে বাদ দিন।','If someone skips or eats fewer meals on a day or several days, set it here by date.')}</p>
  <div class="row"><select id="mcm"><option value="all">${L('সবাই','Everyone')}</option>${M.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><select id="mcn">${[0,1,2,3].map(k=>`<option value="${k}">${f(k)} ${L('বেলা খাবে','meal(s)/day')}</option>`).join('')}</select></div>
  <p class="hint" style="margin:6px 0 0">${L('শুরুর তারিখ – শেষ তারিখ','From date – To date')}</p>
  <div class="row"><input type="date" id="mcf" min="${a}" max="${b}" value="${a}"><input type="date" id="mct" min="${a}" max="${b}" value="${a}"><button class="ad" onclick="addOff()">${L('যোগ','Add')}</button></div>
  ${MC.r.map((r,i)=>`<div class="item"><span>${r.mid=='all'?L('সবাই','Everyone'):esc(nm(r.mid))}: ${dfmt(r.f)}${r.f!=r.t?' → '+dfmt(r.t):''} · ${f(r.m)} ${L('বেলা/দিন','meal(s)/day')}</span><button class="x" onclick="delOff(${i})">✕</button></div>`).join('')}</div>`;
};
function setDef(k){MC.def=k;try{localStorage.setItem('mess_def',k)}catch(e){}sMC();RENDER.mc()}
function addOff(){const[a,b]=mRange(),f_=$('#mcf').value,t_=$('#mct').value,w=$('#mcm').value;
  if(!f_||!t_||f_>t_||f_<a||t_>b){alert(L('তারিখ ঠিক নেই (এই মাসের ভেতরে হতে হবে)','Invalid dates (must be inside this month)'));return}
  MC.r.push({mid:w=='all'?'all':+w,f:f_,t:t_,m:+$('#mcn').value});sMC();RENDER.mc()}
function delOff(i){MC.r.splice(i,1);sMC();RENDER.mc()}

/* ===== BAZAR BY DATE ===== */
RENDER.bz=()=>{
  if(!bf){[bf,bt]=mRange()}
  const ents=BZ.filter(e=>e.d>=bf&&e.d<=bt&&M.some(m=>m.id==e.mid)).sort((x,y)=>y.d.localeCompare(x.d)),tm=M.reduce((s,m)=>s+memberMeals(m.id,bf,bt),0),tb=ents.reduce((s,e)=>s+e.amt,0),rate=tm?tb/tm:0;
  const rows=M.map(m=>{const b=ents.filter(e=>e.mid==m.id).reduce((s,e)=>s+e.amt,0),ms=memberMeals(m.id,bf,bt);return{n:m.name,b,part:tm?b/tm:0,ms,cost:ms*rate,net:b-ms*rate}});
  $('#pbz').innerHTML=`<div class="card"><h2>${L('বাজার যোগ করুন','Add bazar')}</h2>
  <div class="row"><input type="date" id="bzd" value="${today()}"><select id="bzm">${M.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
  <div class="row"><input id="bza" inputmode="decimal" placeholder="${L('টাকা','Amount')}"><input id="bzn" placeholder="${L('কী কিনেছেন (ঐচ্ছিক)','Note (optional)')}"><button class="ad" onclick="addBz()">${L('যোগ','Add')}</button></div></div>
  <div class="card"><h2>${L('তারিখ অনুযায়ী হিসাব','Report by date range')}</h2><p class="hint">${L('শুরুর তারিখ – শেষ তারিখ','From date – To date')}</p>
  <div class="row"><input type="date" id="bf" value="${bf}" onchange="setRg()"><input type="date" id="bt2" value="${bt}" onchange="setRg()"></div>
  <div class="sum"><div><span>${L('মোট বাজার','Total bazar')}</span><b>${f(tb)} ৳</b></div><div><span>${L('মোট মিল (মিল গণনা থেকে)','Total meals (from Meal Count)')}</span><b>${f(tm)}</b></div><div><span>${L('মিল রেট','Meal rate')}</span><b>${g(rate)} ৳</b></div><div><span>${L('বাজারের সংখ্যা','Entries')}</span><b>${f(ents.length)}</b></div></div>
  ${M.length?`<div class="tw"><table><tr><th>${L('নাম','Name')}</th><th>${L('বাজার','Bazar')}</th><th>${L('রেটে অংশ','Rate share')}</th><th>${L('মিল','Meals')}</th><th>${L('মিল খরচ','Meal cost')}</th><th>${L('ফলাফল','Result')}</th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${g(r.b)}</td><td>${g(r.part)}</td><td>${f(r.ms)}</td><td>${g(r.cost)}</td><td class="${r.net>=0?'pos':'neg'}">${r.net>=0?'+':'−'}${g(Math.abs(r.net))}</td></tr>`).join('')}</table></div>
  <p class="hint" style="margin-top:8px">${L('রেটে অংশ = তার বাজার ÷ মোট মিল। সবার অংশ যোগ করলে মিল রেট হয়। ফলাফল = বাজার − মিল খরচ (+ ফেরত পাবে, − দিতে হবে)।','Rate share = their bazar ÷ total meals. Shares add up to the meal rate. Result = bazar − meal cost (+ gets back, − owes).')}</p>`:`<p class="m">${L('আগে মেসের হিসাব থেকে সদস্য যোগ করুন।','Add members in Mess Account first.')}</p>`}</div>
  <div class="card"><h2>${L('বাজারের তালিকা','Bazar entries')}</h2>${ents.map(e=>`<div class="item"><span>${dfmt(e.d)} · ${esc(nm(e.mid))}${e.note?' · '+esc(e.note):''}</span><span>${f(e.amt)} ৳<button class="x" onclick="editBz(${e.id})">✎</button><button class="x" onclick="delBz(${e.id})">✕</button></span></div>`).join('')||`<p class="m">${L('এই সময়ে কোনো বাজার নেই।','No bazar in this period.')}</p>`}</div>${bkb()}`;
};
function setRg(){const a=$('#bf').value,b=$('#bt2').value;if(!a||!b||a>b){alert(L('তারিখ ঠিক নেই','Invalid dates'));return}bf=a;bt=b;RENDER.bz()}
function addBz(){const d=$('#bzd').value,m=$('#bzm').value,a=P($('#bza').value);if(!d||!m||!a)return;BZ.push({id:uid(BZ),d,mid:+m,amt:a,note:$('#bzn').value.trim()});sBZ();RENDER.bz()}
function editBz(id){const e=BZ.find(x=>x.id==id),a=prompt(L('টাকা','Amount'),e.amt);if(a===null)return;const n=prompt(L('কী কিনেছেন','Note'),e.note||'');if(P(a))e.amt=P(a);if(n!==null)e.note=n.trim();sBZ();RENDER.bz()}
function delBz(id){if(confirm(L('এই বাজার মুছবেন?','Delete this entry?'))){BZ=BZ.filter(x=>x.id!=id);sBZ();RENDER.bz()}}

$('#mon').onchange=e=>{mon=e.target.value||mon;bf='';load();RENDER[pg]()};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
load();history.replaceState({p:'home'},'');go('home',false);

</script>
</body>
